name: CI

on:
  # 2026-10-22：暂停自动 CI。原因：账号 Free 计划私有仓库 Actions 配额已用 90%
  #（1,813/2,000 分钟），且本仓库 10 月全部 49 次运行均失败（卡在 Skill 构建校验），
  # 自动触发既烧额度又没有可信信号。
  # 改为按需手动触发：
  #   网页 → Actions → CI → Run workflow → 选择分支 main
  #   CLI  → gh workflow run CI --repo QWQcool/VDACC --ref main
  # 恢复自动需把 push / pull_request 加回来，见文末「恢复自动」。
  workflow_dispatch:

jobs:
  test-ts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装 TS 依赖
        run: cd ts && bun install --frozen-lockfile
      - name: TS 单测 + 服务端安全用例
        run: bun test ts/tests
      - name: TS Skill 构建校验
        run: python tools/build_skill_ts.py

# 2026-10-25：旧运行 39744319053 的 TS 构建失败已定位为 Windows cp1252
# 无法输出中文日志。build_skill_ts.py 统一 UTF-8；固定 Bun 以复现本地验收。
# 继续手动触发以控制配额；自动 CI、Release 与 legacy 构建不在本次变更范围。
