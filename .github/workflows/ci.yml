name: CI

on:
  # 2026-11-20：恢复 push / PR 自动触发（用户确认配额可以）。只跑 `bun test` 与 Skill 构建校验，
  # 不跑发行构建——一次约 2–3 分钟，比 10 月那批卡在构建上的运行便宜得多。
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 仍保留手动触发（排查用）：
  #   gh workflow run CI --repo QWQcool/VDACC --ref main
  workflow_dispatch:

jobs:
  test-ts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装 TS 依赖
        run: cd ts && bun install --frozen-lockfile
      - name: TS 单测 + 服务端安全用例
        run: bun test ts/tests
      - name: TS Skill 构建校验
        run: python tools/build_skill_ts.py

# 2026-10-25：旧运行 39744319053 的 TS 构建失败已定位为 Windows cp1252
# 无法输出中文日志。build_skill_ts.py 统一 UTF-8；固定 Bun 以复现本地验收。
# 2026-11-20：恢复 push / pull_request 自动触发（配额已确认可用）。
# 故意不在这里构建 exe / zip：发行构建仍走本地 `python tools/build_skill_ts.py --zip` + 体积基线，
# CI 只做「测试 + Skill 构建校验」这一层，分钟数最小。
