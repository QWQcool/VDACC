<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VDACC 引擎 M0</title>
<style>
  /* 配色沿用现有壳（f6f7fb 底 + ec4899 主色），M0 只是验证页，不引入设计系统 */
  :root { color-scheme: light; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 18px 16px 40px; background: #f6f7fb; color: #171923;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 14px; line-height: 1.6;
  }
  h1 { font-size: 17px; margin: 0 0 2px; }
  .sub { color: #8b93a7; font-size: 12px; margin-bottom: 16px; }
  .card {
    background: #fff; border: 1px solid rgba(15, 23, 42, .08); border-radius: 14px;
    padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(15, 23, 42, .04);
  }
  .card h2 { font-size: 13px; margin: 0 0 10px; color: #596174; font-weight: 600; letter-spacing: .02em; }
  .row { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; padding: 3px 0; }
  .row .k { color: #8b93a7; flex: none; }
  .row .v { text-align: right; word-break: break-all; font-variant-numeric: tabular-nums; }
  .ok { color: #0f9d58; } .bad { color: #d93025; }
  button {
    width: 100%; height: 44px; border: 0; border-radius: 11px; color: #fff; font-size: 14px;
    font-weight: 600; background: linear-gradient(180deg, #f062a8, #ec4899); margin-top: 10px;
  }
  button.ghost { background: #fff; color: #171923; border: 1px solid rgba(15, 23, 42, .12); }
  button:disabled { opacity: .55; }
  ul.checks { list-style: none; margin: 0; padding: 0; }
  ul.checks li { display: flex; gap: 8px; font-size: 12px; padding: 4px 0; border-top: 1px dashed rgba(15,23,42,.07); }
  ul.checks li:first-child { border-top: 0; }
  .mark { flex: none; width: 34px; font-weight: 700; font-size: 11px; line-height: 20px; }
  .why { color: #8b93a7; font-size: 11px; word-break: break-all; }
  pre {
    margin: 8px 0 0; padding: 10px; background: #f6f7fb; border-radius: 9px;
    font-size: 11px; line-height: 1.55; white-space: pre-wrap; word-break: break-all;
    max-height: 220px; overflow: auto; font-family: ui-monospace, Menlo, Consolas, monospace;
  }
</style>
</head>
<body>
  <h1>VDACC 引擎 · M0 验证</h1>
  <div class="sub">这个页面不是产品界面，只回答两个问题：引擎打包对不对、桥通不通。</div>

  <div class="card">
    <h2>运行环境</h2>
    <div class="row"><span class="k">引擎版本</span><span class="v" id="ver">—</span></div>
    <div class="row"><span class="k">打包时间</span><span class="v" id="built">—</span></div>
    <div class="row"><span class="k">原生桥</span><span class="v" id="bridge">检测中…</span></div>
    <div class="row"><span class="k">输出位置</span><span class="v" id="out">—</span></div>
    <div class="row"><span class="k">暂存目录</span><span class="v" id="staging">—</span></div>
  </div>

  <div class="card">
    <h2>自检（纯函数 + 桥交叉校验）</h2>
    <div class="row"><span class="k">结果</span><span class="v" id="summary">未运行</span></div>
    <ul class="checks" id="checks"></ul>
    <button id="run">运行自检</button>
  </div>

  <div class="card">
    <h2>网络探针（真实请求 douyin.com）</h2>
    <div class="row"><span class="k">HTTP 状态</span><span class="v" id="netStatus">—</span></div>
    <div class="row"><span class="k">ttwid</span><span class="v" id="ttwid">—</span></div>
    <div class="row"><span class="k">响应长度</span><span class="v" id="netBytes">—</span></div>
    <div class="row"><span class="k">耗时</span><span class="v" id="netMs">—</span></div>
    <button class="ghost" id="net">请求抖音</button>
  </div>

  <div class="card">
    <h2>落盘探针（分块写入 Download/VDACC）</h2>
    <div class="row"><span class="k">文件</span><span class="v" id="file">—</span></div>
    <div class="row"><span class="k">字节</span><span class="v" id="bytes">—</span></div>
    <div class="row"><span class="k">分块数</span><span class="v" id="chunks">—</span></div>
    <div class="row"><span class="k">内容 md5</span><span class="v" id="md5">—</span></div>
    <button class="ghost" id="write">写测试文件</button>
  </div>

<script src="../engine/engine.bundle.js"></script>
<script>
  // 引擎是必需依赖：加载失败就直接说清楚，不要留一个「点了没反应」的页面
  const $ = (id) => document.getElementById(id);
  const engine = globalThis.VDACC_ENGINE;

  function setText(id, text, cls) {
    const el = $(id);
    el.textContent = text;
    el.className = 'v' + (cls ? ' ' + cls : '');
  }

  if (!engine) {
    setText('ver', '打包产物没加载', 'bad');
    setText('bridge', '引擎缺失', 'bad');
    $('run').disabled = true;
    $('write').disabled = true;
  } else {
    const info = engine.engineInfo();
    setText('ver', info.version);
    setText('built', info.builtAt);
    const bridge = typeof window.VDACC_BRIDGE?.post === 'function';
    setText('bridge', bridge ? '已注册' : '未注册（非 App 环境）', bridge ? 'ok' : 'bad');
  }

  function renderChecks(report) {
    const list = $('checks');
    list.textContent = '';
    for (const c of report.checks) {
      const li = document.createElement('li');
      const mark = document.createElement('span');
      mark.className = 'mark ' + (c.ok ? 'ok' : 'bad');
      mark.textContent = c.ok ? 'PASS' : 'FAIL';
      const body = document.createElement('div');
      const name = document.createElement('div');
      name.textContent = c.name;
      body.appendChild(name);
      if (!c.ok) {
        const why = document.createElement('div');
        why.className = 'why';
        why.textContent = '期望 ' + c.expected + ' ／ 实际 ' + c.actual + (c.note ? '（' + c.note + '）' : '');
        body.appendChild(why);
      }
      li.appendChild(mark);
      li.appendChild(body);
      list.appendChild(li);
    }
    setText('summary', report.passed + '/' + report.total + (report.ok ? ' 全部通过' : ' 有失败项'), report.ok ? 'ok' : 'bad');
  }

  $('run').addEventListener('click', async () => {
    const btn = $('run');
    if (!engine) return;
    btn.disabled = true;
    setText('summary', '运行中…');
    try {
      const report = await engine.selfTest();
      renderChecks(report);
    } catch (error) {
      setText('summary', '自检抛错：' + (error && error.message ? error.message : error), 'bad');
    } finally {
      btn.disabled = false;
    }
  });

  $('write').addEventListener('click', async () => {
    const btn = $('write');
    if (!engine) return;
    btn.disabled = true;
    setText('file', '写入中…');
    try {
      const res = await engine.writeProbe();
      setText('file', res.path, 'ok');
      setText('bytes', String(res.bytes));
      setText('chunks', String(res.chunks));
      setText('md5', res.md5);
    } catch (error) {
      setText('file', '失败：' + (error && error.message ? error.message : error), 'bad');
    } finally {
      btn.disabled = false;
    }
  });

  $('net').addEventListener('click', async () => {
    const btn = $('net');
    if (!engine) return;
    btn.disabled = true;
    setText('netStatus', '请求中…');
    try {
      const res = await engine.netProbe();
      setText('netStatus', String(res.status), res.status >= 200 && res.status < 400 ? 'ok' : 'bad');
      setText('ttwid', res.ttwid ? '已拿到' : '没有（Set-Cookie 未解析）', res.ttwid ? 'ok' : 'bad');
      setText('netBytes', String(res.bytes));
      setText('netMs', res.ms + ' ms' + (res.bridged ? '（走桥）' : '（未走桥）'));
    } catch (error) {
      setText('netStatus', '失败：' + (error && error.message ? error.message : error), 'bad');
    } finally {
      btn.disabled = false;
    }
  });

  // 进入页面就把能拿的信息都拿一遍：路径与自检都不该需要用户点两下才知道环境
  (async () => {
    if (!engine) return;
    try {
      const info = await engine.paths();
      setText('out', info.out + '（' + info.outKind + '）');
      setText('staging', info.staging);
    } catch (error) {
      setText('out', '取不到：' + (error && error.message ? error.message : error), 'bad');
    }
    $('run').click();
    // 验收脚本用：`?probe=1` 跑落盘探针，`?probe=net` 跑网络探针（不用「滚动 + 手点」）
    const probe = new URLSearchParams(location.search).get('probe');
    if (probe === '1') setTimeout(() => $('write').click(), 400);
    if (probe === 'net') setTimeout(() => $('net').click(), 400);
  })();
</script>
</body>
</html>
