plugins {
    id 'com.android.application'
    // Kotlin 只是**语言插件**（编译期），不引入任何运行时框架：
    // 仍然没有 AndroidX / OkHttp / Room，依赖清单还是空的。
    id 'org.jetbrains.kotlin.android'
}

// release 签名：真实密钥**不入库**（`keystore/` 与 `keystore.properties` 都在 .gitignore 里）。
// 没有 keystore.properties 时 debug 照常；`assembleRelease` 会在下面的 taskGraph 钩子里**直接失败**
// ——未签名的 release 包装不上、也没法升级覆盖，静默产出比报错更坑。
def keystorePropsFile = rootProject.file('keystore.properties')
def hasReleaseKey = keystorePropsFile.exists()
def keystoreProps = new Properties()
if (hasReleaseKey) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.vdacc.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.vdacc.app'
        // 26：前台服务与通知渠道的语义干净（设计稿 §13 决策，2026-10-27 拍板）
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseKey) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

// 仍然刻意不引第三方运行时依赖：壳子只做 WebView 包装 + 一条桥。
// kotlin-stdlib 由 Kotlin 插件自动加入（它是语言运行库，不是业务框架）。
dependencies {}

// 没有密钥就别悄悄产出未签名包：`assembleRelease` 直接失败并说清怎么补。
gradle.taskGraph.whenReady { graph ->
    if (!hasReleaseKey && graph.allTasks.any { it.name == 'assembleRelease' }) {
        // 用英文：Windows 控制台默认 GBK，中文在这里会变成乱码，反而看不懂
        throw new GradleException(
            'Missing mobile/android/keystore.properties: release builds must be signed.'
            + ' Copy keystore.properties.example, generate the key with its keytool command, then retry.')
    }
}
