<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VDACC · 媒体下载器</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#ec4899">
  <link rel="apple-touch-icon" href="/assets/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true">▣</span>
      <b>VDACC</b>
      <span class="sub">媒体下载器</span>
    </div>
    <div class="topbar-right">
      <span class="ver" id="ver"></span>
      <button id="settings" class="ghost" title="设置" aria-label="设置">⚙</button>
      <button id="theme" class="ghost" title="切换明暗主题" aria-label="切换明暗主题">◐</button>
    </div>
  </header>

  <main>
    <section id="gate" class="card hidden">
      <div class="card-head">
        <h2>连接本机 VDACC</h2>
        <p>第一次在手机或新浏览器打开时，需要粘贴启动时打印的 token。只需一次。</p>
      </div>
      <div class="row">
        <input id="gate-token" type="text" autocomplete="off" spellcheck="false"
               placeholder="粘贴 token">
        <button id="gate-go" class="primary">进入</button>
      </div>
      <p class="hint">在运行 <code>vdl serve</code> 的窗口里找 <code>?token=</code> 后面那串。</p>
    </section>

    <section class="card input-card">
      <div class="card-head">
        <h2>粘贴链接开始</h2>
        <p>自动识别平台与可选档位。解析后可以一次勾选多个档位一起下载。</p>
      </div>

      <div class="row">
        <input id="url" type="text" autocomplete="off" spellcheck="false"
               placeholder="抖音链接 / 短链 / 视频 ID">
        <button id="probe" class="primary">解析</button>
      </div>

      <div id="chips" class="chips hidden" role="group" aria-label="画质快捷选择"></div>

      <div class="input-foot">
        <label class="switch" title="L2 通用嗅探还没实现，先不假装能用">
          <input type="checkbox" id="force-generic" disabled>
          <span>强制使用通用解析</span>
          <span class="soon">未实现</span>
        </label>
        <span class="hint">支持抖音、B站、网易云单曲</span>
      </div>
    </section>

    <section id="result" class="card hidden" aria-live="polite"></section>

    <section id="jobs-section" class="hidden">
      <div class="section-head">
        <h2>任务</h2>
        <button id="clear-done" class="link">清除已完成</button>
      </div>
      <div id="jobs" class="jobs" aria-live="polite"></div>
    </section>

    <section id="empty" class="card empty">
      <img src="/assets/pero-stand.png" alt="" class="empty-char">
      <div class="empty-text">
        <h3>还没有任务</h3>
        <p>粘贴一个抖音链接试试。解析后能选清晰度、看体积，多个档位可以一起下。</p>
      </div>
    </section>

    <footer class="foot">
      <span id="outdir"></span>
      <span id="status" aria-live="polite"></span>
    </footer>
  </main>

  <div id="done-banner" class="done-banner hidden">
    <img src="/assets/pero-done.png" alt="">
    <div>
      <b>下载完成</b>
      <span id="done-text"></span>
    </div>
  </div>

  <dialog id="settings-dialog" class="settings-dialog">
    <div class="preview-head">
      <b>设置</b>
      <button id="settings-close" class="ghost" aria-label="关闭">✕</button>
    </div>
    <div class="settings-body">
      <label>输出目录<input id="set-out" type="text" placeholder="留空使用默认"></label>
      <label>主题<select id="set-theme"><option value="light">浅色</option><option value="dark">深色</option></select></label>
      <label>并发<select id="set-concurrency"><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
      <label class="subs"><input id="set-generic" type="checkbox"> 启用通用解析（yt-dlp 组件）</label>
      <p id="comp-status" class="hint"></p>
      <div class="settings-actions">
        <button id="comp-install" class="ghost" type="button">下载组件</button>
        <span class="spacer"></span>
        <button id="set-save" class="primary" type="button">保存</button>
      </div>
    </div>
  </dialog>

  <dialog id="preview" class="preview">
    <div class="preview-head">
      <b id="preview-title">预览</b>
      <button id="preview-close" class="ghost" aria-label="关闭预览">✕</button>
    </div>
    <video id="preview-video" controls playsinline preload="metadata"></video>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
