<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VDACC 示意 · 设置</title>
<link rel="stylesheet" href="mockup.css">
</head>
<body>
<div class="wrap">

  <nav class="nav-demo">
    <b>示意页面</b>
    <a href="index.html">主界面</a>
    <a href="batch.html">分P批量</a>
    <a href="album-dark.html">专辑（暗色）</a>
    <a class="on" href="settings.html">设置</a>
  </nav>

  <header class="appbar">
    <span class="logo">V</span>
    <h1>VDACC</h1>
    <span class="sub">媒体下载器</span>
    <span class="spacer"></span>
    <span class="ver">V3.2.0</span>
    <button class="icon-btn" title="主题">◐</button>
    <button class="icon-btn" title="设置">⚙</button>
  </header>

  <section class="card" style="opacity:.55;pointer-events:none">
    <div class="card-title">平台链接</div>
    <div class="input-row">
      <input class="field" placeholder="粘贴链接" disabled>
      <button class="btn primary" disabled>解析</button>
    </div>
  </section>
</div>

<!-- 设置对话框 -->
<div class="overlay">
  <div class="dialog" role="dialog" aria-label="设置">
    <div class="dhead">
      <span>设置</span>
      <button class="btn sm ghost">✕</button>
    </div>
    <div class="dbody">

      <div class="drow">
        <label>输出目录</label>
        <input class="field" value="C:\Users\me\Desktop\VDACC\下载" spellcheck="false">
        <p class="hint">留空使用默认 <b>下载\</b>；路径只保存在本机。</p>
      </div>

      <div class="drow">
        <label>下载限速（字节/秒）</label>
        <input class="field" placeholder="例如 2097152（2 MB/s），留空不限速" spellcheck="false">
        <p class="hint">按单条流计算；B站 音轨会另起一份预算。</p>
      </div>

      <div class="drow">
        <label>主题</label>
        <select class="field">
          <option>浅色</option>
          <option>深色</option>
        </select>
      </div>

      <div class="drow">
        <label>并发任务</label>
        <select class="field"><option>1（默认，对平台更友好）</option><option>2</option></select>
      </div>

      <div class="drow">
        <label>通用解析组件（yt-dlp）</label>
        <div class="comp">
          <span>ytdlp-generic</span>
          <span class="tag ok state">已安装</span>
          <button class="btn sm ghost">卸载</button>
        </div>
        <p class="hint">只在你明确点「下载组件」时联网；官网直链 + SHA256 校验。</p>
      </div>

    </div>
    <div class="dfoot">
      <button class="btn ghost">取消</button>
      <button class="btn primary">保存</button>
    </div>
  </div>
</div>

</body>
</html>
